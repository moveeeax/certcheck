[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "certcheck"
dynamic = ["version"]
description = "TLS certificate expiry and info checker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/moveeeax/certcheck"
Repository = "https://github.com/moveeeax/certcheck"

[project.scripts]
certcheck = "certcheck.cli:main"

[tool.setuptools]
packages = ["certcheck"]

[tool.setuptools.dynamic]
version = { attr = "certcheck.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
